# PLI-HazardTrack - stack de producao para a VM AWS (sa-east-1)
# Subir: docker compose -f docker-compose.vm.yml up -d

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: pli-hazardtrack-app:latest
    container_name: pli_hazardtrack_app
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: "1.5"
        reservations:
          memory: 512M
          cpus: "0.25"
    mem_limit: 1536m
    mem_reservation: 512m
    cpus: 1.5
    environment:
      PORT: "5050"
      SAMAEG_FORCE_MOCK: "0"
      SAMAEG_USE_MANUAL_RA: "0"
      SAMAEG_DEGRADED_24H: "6"
      SAMAEG_WORKERS: "12"
      SAMAEG_DECODE_WORKERS: "6"
      SAMAEG_INGEST_INTERVAL_S: "120"
      SAMAEG_REFETCH_FRESH_H: "4"
      SAMAEG_REFETCH_STALE_H: "24"
      SAMAEG_CACHE_TTL_D: "30"
      GUNICORN_WORKERS: "1"
      GUNICORN_THREADS: "8"
      GUNICORN_TIMEOUT: "3600"
      SIGMA_API_BASE_URL: "${SIGMA_API_BASE_URL:-}"
      SIGMA_DATABASE_URL: "${SIGMA_DATABASE_URL:-}"
      SIGMA_POSTGRES_HOST: "${SIGMA_POSTGRES_HOST:-}"
      SIGMA_POSTGRES_PORT: "${SIGMA_POSTGRES_PORT:-5433}"
      SIGMA_POSTGRES_DATABASE: "${SIGMA_POSTGRES_DATABASE:-sigma_pli_qr53}"
      SIGMA_POSTGRES_USER: "${SIGMA_POSTGRES_USER:-sigma_user}"
      SIGMA_POSTGRES_PASSWORD: "${SIGMA_POSTGRES_PASSWORD:-}"
      SIGMA_POSTGRES_SSLMODE: "${SIGMA_POSTGRES_SSLMODE:-disable}"
      ADMIN_USER: "${ADMIN_USER:-}"
      ADMIN_PASS: "${ADMIN_PASS:-}"
      ADMIN_SECRET: "${ADMIN_SECRET:-}"
      DEPLOY_ENV: "vm-aws-sa-east-1"
      FORCE_HTTPS_COOKIES: "1"
      PLI_RUNTIME_DIR: "/app/data/_runtime"
      QUEIMADAS_AUTO: "1"
      QUEIMADAS_POLL_MIN: "30"
      SAMAEG_MERGE_CACHE_DIR: "/app/data/_cache/merge"
    command: >
      sh -c "exec gunicorn app:app
        --bind 0.0.0.0:5050
        --worker-class gthread
        --workers ${GUNICORN_WORKERS:-1}
        --threads ${GUNICORN_THREADS:-8}
        --timeout ${GUNICORN_TIMEOUT:-3600}
        --graceful-timeout 30
        --keep-alive 75
        --worker-tmp-dir /dev/shm
        --access-logfile -
        --error-logfile -"
    ports:
      - "127.0.0.1:5050:5050"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "http://127.0.0.1:5050/api/health",
        ]
      interval: 60s
      timeout: 15s
      start_period: 300s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    volumes:
      - pli_hazardtrack_merge_cache:/app/data/_cache/merge
      - pli_hazardtrack_runtime:/app/data/_runtime
      - pli_hazardtrack_queimadas:/app/data/queimadas
      - pli_hazardtrack_queimadas_pub:/app/static/data/queimadas
    networks:
      - pli_hazardtrack_net
      - sra_net

networks:
  pli_hazardtrack_net:
    name: pli_hazardtrack_net
    driver: bridge
  sra_net:
    external: true

volumes:
  pli_hazardtrack_merge_cache:
    name: pli_hazardtrack_merge_cache
  pli_hazardtrack_runtime:
    name: pli_hazardtrack_runtime
  pli_hazardtrack_queimadas:
    name: pli_hazardtrack_queimadas
  pli_hazardtrack_queimadas_pub:
    name: pli_hazardtrack_queimadas_pub

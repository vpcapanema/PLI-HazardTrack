services:
  - type: web
    name: pli-hazardtrack
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      # Force RA manual em dev se quiser; em producao deixe desativado
      - key: SAMAEG_USE_MANUAL_RA
        value: "0"
      # Numero de horas faltando aceitas antes de marcar "degraded"
      - key: SAMAEG_DEGRADED_24H
        value: "6"
      # Em producao NUNCA usar mock
      - key: SAMAEG_FORCE_MOCK
        value: "0"
      # Downloads MERGE/INPE em paralelo (leitura eccodes continua serial).
      - key: SAMAEG_WORKERS
        value: "12"
      - key: SAMAEG_DECODE_WORKERS
        value: "6"
      - key: SAMAEG_INGEST_INTERVAL_S
        value: "120"
      # Politica de refetch por idade do dado (substitui SAMAEG_REFETCH_RECENT_H).
      # Hora com idade < FRESH_H sempre re-baixada; >= STALE_H nunca; entre as
      # duas, no maximo 1x/dia. Acoplado ao cache em disco data/_cache/merge/.
      - key: SAMAEG_REFETCH_FRESH_H
        value: "4"
      - key: SAMAEG_REFETCH_STALE_H
        value: "24"
      # Area /admin - configure no painel do Render (Settings > Environment)
      - key: SIGMA_API_BASE_URL
        sync: false
      - key: SIGMA_POSTGRES_HOST
        sync: false
      - key: SIGMA_POSTGRES_PASSWORD
        sync: false
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASS
        sync: false
      - key: ADMIN_SECRET
        sync: false

# =============================================================================
# PLI-HazardTrack — sub-rota sob o Nginx principal do SIGMA
#
# Publica a aplicacao em  http://<IP-do-SIGMA>/pli-hazardtrack/  (HTTP no IP),
# irmao do Smart Router, evitando bloqueio de firewalls a dominios/HTTPS.
#
# A app ja usa ProxyFix(x_prefix=1): o Nginx faz o strip do prefixo no
# proxy_pass (barra final) e envia X-Forwarded-Prefix, para o Flask gerar
# url_for() ja com /pli-hazardtrack.
#
# Instale em /etc/nginx/snippets/pli-hazardtrack-subpath.conf e inclua dentro
# do server{} :80 do SIGMA:  include /etc/nginx/snippets/pli-hazardtrack-subpath.conf;
# =============================================================================

location = /pli-hazardtrack { return 301 /pli-hazardtrack/; }

# SSE de progresso — sem buffering
location = /pli-hazardtrack/api/progress/stream {
    gzip off;
    proxy_pass http://pli_hazardtrack_app/api/progress/stream;
    proxy_http_version 1.1;
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-Prefix /pli-hazardtrack;
    proxy_set_header Accept-Encoding    "";
    proxy_set_header Connection         "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    send_timeout 3600s;
}

# HLS das cameras DER — sem buffering
location ^~ /pli-hazardtrack/api/der/hls/ {
    gzip off;
    proxy_pass http://pli_hazardtrack_app/api/der/hls/;
    proxy_http_version 1.1;
    proxy_set_header Host               $host;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-Prefix /pli-hazardtrack;
    proxy_set_header Connection         "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}

# Aplicacao HazardTrack sob /pli-hazardtrack/
location ^~ /pli-hazardtrack/ {
    proxy_pass http://pli_hazardtrack_app/;
    proxy_http_version 1.1;
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-Prefix /pli-hazardtrack;
    proxy_set_header Connection         "";
    client_max_body_size 4m;
    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;
}

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="index,follow">
  <title>{% block doc_title %}Documentação{% endblock %} · PLI-HazardTrack</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='docs.css') }}">
  {% block extra_head %}{% endblock %}
</head>
<body class="docs-page">
  <div class="docs-shell">
    <aside class="sidebar docs-sidebar" aria-label="Navegação da página">
      <a href="{{ url_for('index') }}" class="sidebar-header docs-home-link">
        <div class="logo">
          <div class="logo-mark">
            <svg
              class="logo-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M9 3.5 3 6v14.5l6-2.5 6 2.5 6-2.5V6l-6 2.5" />
              <path d="M9 3.5v6" />
              <path d="M12.1 17.4h5.8a1 1 0 0 0 .87-1.5l-2.9-5a1 1 0 0 0-1.74 0l-2.9 5a1 1 0 0 0 .87 1.5Z" />
              <path d="M15 13v1.2" />
              <path d="M15 15.9v.1" />
            </svg>
            <span>PLI-HAZARDTRACK</span>
          </div>
          <p class="logo-sub">
            Riscos climáticos extremos · PLI-SP
          </p>
        </div>
      </a>

      <nav class="docs-sidebar-nav" aria-label="Seções desta página">
        <div class="sb-panel is-open" id="docs-toc-panel">
          <button
            type="button"
            class="sb-panel-head docs-toc-toggle"
            data-docs-toc-toggle
            aria-expanded="true"
            aria-controls="docs-toc-body"
          >
            <span class="sb-panel-label">{% block toc_label %}Nesta página{% endblock %}</span>
            <span class="sb-chevron" aria-hidden="true">▾</span>
          </button>
          <div class="sb-panel-body" id="docs-toc-body">
            <ul class="docs-toc" id="docs-toc"></ul>
          </div>
        </div>
      </nav>
    </aside>

    <div class="docs-content" id="docs-content">
      <div class="docs-body modal-body" id="docs-body">
        <header class="docs-page-header">
          <h1>{% block page_heading %}Documentação{% endblock %}</h1>
          {% block page_lead %}{% endblock %}
        </header>
        {% block content %}{% endblock %}
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='docs.js') }}"></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>

services:
  - type: web
    name: pli-hazardtrack
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      # Force RA manual em dev se quiser; em producao deixe desativado
      - key: SAMAEG_USE_MANUAL_RA
        value: "0"
      # Numero de horas faltando aceitas antes de marcar "degraded"
      - key: SAMAEG_DEGRADED_24H
        value: "6"
      # Em producao NUNCA usar mock
      - key: SAMAEG_FORCE_MOCK
        value: "0"

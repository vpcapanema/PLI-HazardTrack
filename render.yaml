services:
  - type: web
    name: pli-hazardtrack
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      # Force RA manual em dev se quiser; em producao deixe desativado
      - key: SAMAEG_USE_MANUAL_RA
        value: "0"
      # Numero de horas faltando aceitas antes de marcar "degraded"
      - key: SAMAEG_DEGRADED_24H
        value: "6"
      # Em producao NUNCA usar mock
      - key: SAMAEG_FORCE_MOCK
        value: "0"
      # Free tier: 0.5 CPU / 512 MB. Mais workers do que isso satura.
      - key: SAMAEG_WORKERS
        value: "4"
      # Pagina /ops - configure no painel do Render (Settings > Environment)
      - key: OPS_USER
        sync: false
      - key: OPS_PASS
        sync: false
      - key: OPS_PASS_SHA256
        sync: false
      - key: OPS_SECRET
        sync: false
